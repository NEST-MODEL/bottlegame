<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0, viewport-fit=cover">
<title>Global Coffee — прототип</title>
<script src="https://cdn.tailwindcss.com"></script>
<script src="https://unpkg.com/lucide@latest"></script>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:opsz,wght@9..144,500;9..144,600;9..144,700&family=Inter:wght@400;500;600;700;800&display=swap" rel="stylesheet">
<style>
  :root{
    --espresso:#241712;
    --espresso-2:#3A2A21;
    --cream:#FBF6ED;
    --sand:#EFE3CF;
    --caramel:#B9772F;
    --caramel-2:#D89A4E;
    --sage:#5E7C4F;
    --sage-bg:#E7EEDF;
    --danger:#B24B3E;
  }
  *{ -webkit-tap-highlight-color: transparent; }
  html,body{ overflow-x:hidden; }
  body{
    font-family:'Inter',sans-serif;
    background:var(--cream);
    color:var(--espresso);
  }
  .font-display{ font-family:'Fraunces',serif; }
  .app-shell{ max-width:480px; margin:0 auto; min-height:100vh; background:var(--cream); position:relative; box-shadow:0 0 60px rgba(36,23,18,0.08); }
  @media(min-width:900px){
    .app-shell{ max-width:1180px; }
    .desktop-grid{ display:grid; grid-template-columns: 320px 1fr; gap:0; }
  }
  .safe-bottom{ padding-bottom: calc(88px + env(safe-area-inset-bottom)); }
  .card{ background:#fff; border-radius:22px; box-shadow:0 1px 2px rgba(36,23,18,0.04), 0 8px 24px -12px rgba(36,23,18,0.12); }
  .btn-primary{
    background:var(--espresso); color:var(--cream); border-radius:16px;
    transition:transform .15s ease, background .2s ease; font-weight:600;
  }
  .btn-primary:active{ transform:scale(0.97); background:var(--espresso-2); }
  .btn-secondary{
    background:var(--sand); color:var(--espresso); border-radius:16px; font-weight:600;
    transition:transform .15s ease;
  }
  .btn-secondary:active{ transform:scale(0.97); }
  .chip{ border-radius:999px; font-weight:600; font-size:13px; padding:8px 16px; white-space:nowrap; transition:all .15s ease; }
  .chip-active{ background:var(--espresso); color:var(--cream); }
  .chip-idle{ background:#fff; color:var(--espresso-2); border:1px solid #E7DCC8; }
  .dot-open{ width:7px; height:7px; border-radius:999px; background:var(--sage); display:inline-block; }
  .badge-green{ background:var(--sage-bg); color:var(--sage); font-weight:700; }
  .badge-caramel{ background:#F6E7D3; color:var(--caramel); font-weight:700; }
  .nav-item{ display:flex; flex-direction:column; align-items:center; gap:3px; color:#B4A794; font-size:11px; font-weight:600; }
  .nav-item.active{ color:var(--espresso); }
  .fade-in{ animation:fadeIn .35s ease both; }
  @keyframes fadeIn{ from{opacity:0; transform:translateY(6px);} to{opacity:1; transform:translateY(0);} }
  .sheet{ animation:sheetUp .28s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes sheetUp{ from{ transform:translateY(100%);} to{ transform:translateY(0);} }
  .toast-in{ animation:toastIn .35s cubic-bezier(.2,.9,.3,1) both; }
  @keyframes toastIn{ from{ opacity:0; transform:translateY(-16px) scale(.96);} to{opacity:1; transform:translateY(0) scale(1);} }
  .pulse-ring{ animation:pulse 1.8s ease-in-out infinite; }
  @keyframes pulse{ 0%,100%{opacity:1;} 50%{opacity:.4;} }
  .scrollbar-none::-webkit-scrollbar{ display:none; }
  .scrollbar-none{ -ms-overflow-style:none; scrollbar-width:none; }
  input[type=radio], input[type=checkbox]{ accent-color: var(--espresso); }
  .role-toggle{ background:#fff; border:1px solid #E7DCC8; border-radius:999px; padding:4px; display:flex; gap:2px; }
  .role-btn{ border-radius:999px; padding:6px 12px; font-size:12px; font-weight:700; }
</style>
</head>
<body>
<div id="root"></div>

<script>
/* ============================= DATA LAYER ============================= */
const STORAGE_KEY = 'gc_state_v1';

const seedMenu = () => [

  {id:'m7', cat:'cold', name:'Айс Латте', desc:'Латте со льдом', price:1700, img:'https://images.unsplash.com/photo-1461023058943-07fcbe16d735?q=80&w=400&auto=format&fit=crop', customizable:true},
  {id:'m8', cat:'cold', name:'Холодный Брю', desc:'Настаивается 12 часов', price:1900, img:'https://images.unsplash.com/photo-1517701604599-bb29b565090c?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m9', cat:'cold', name:'Лимонад Клубника-Базилик', desc:'Освежающий, без кофеина', price:1600, img:'https://images.unsplash.com/photo-1621263764928-df1444c5e859?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m10', cat:'tea', name:'Чёрный чай', desc:'Крупнолистовой, классика', price:1000, img:'https://images.unsplash.com/photo-1544787219-7f47ccb76574?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m11', cat:'tea', name:'Зелёный чай Сенча', desc:'Лёгкий и травяной', price:1100, img:'https://images.unsplash.com/photo-1556679343-c7306c1976bc?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m12', cat:'tea', name:'Матча Латте', desc:'Японский зелёный чай с молоком', price:1900, img:'https://images.unsplash.com/photo-1515823064-d6e0c04616a7?q=80&w=400&auto=format&fit=crop', customizable:true},
  {id:'m13', cat:'bakery', name:'Круассан', desc:'Слоёный, сливочный', price:750, img:'https://images.unsplash.com/photo-1555507036-ab1f4038808a?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m14', cat:'bakery', name:'Синнабон', desc:'С корицей и глазурью', price:1100, img:'https://images.unsplash.com/photo-1509365465985-25d11c17e812?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m15', cat:'bakery', name:'Багет с ветчиной', desc:'Сытный завтрак', price:1400, img:'https://images.unsplash.com/photo-1481070555726-e2fe8357725c?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m16', cat:'dessert', name:'Чизкейк Нью-Йорк', desc:'Классический, на песочной основе', price:1600, img:'https://images.unsplash.com/photo-1533134242443-d4fd215305ad?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m17', cat:'dessert', name:'Тирамису', desc:'С маскарпоне и какао', price:1700, img:'https://images.unsplash.com/photo-1571877227200-a0d98ea607e9?q=80&w=400&auto=format&fit=crop', customizable:false},
  {id:'m18', cat:'dessert', name:'Брауни', desc:'Шоколадный, с орехом пекан', price:1300, img:'https://images.unsplash.com/photo-1606313564200-e75d5e30476c?q=80&w=400&auto=format&fit=crop', customizable:false},
];

const seedCafes = () => [
  {id:'c1', name:'Global Coffee — Абая', address:'ул. Абая, 25', phone:'+7 701 111 22 33', hours:'08:00–23:00', wait:6, wifi:true, sockets:true, seats:24, img:'https://images.unsplash.com/photo-1554118811-1e0d58224f24?q=80&w=800&auto=format&fit=crop'},
  {id:'c2', name:'Global Coffee — Тауке хана', address:'просп. Тауке хана, 12', phone:'+7 701 222 33 44', hours:'07:30–22:00', wait:4, wifi:true, sockets:true, seats:18, img:'https://images.unsplash.com/photo-1453614512568-c4024d13c247?q=80&w=800&auto=format&fit=crop'},
  {id:'c3', name:'Global Coffee — Республика', address:'просп. Республики, 8', phone:'+7 701 333 44 55', hours:'08:00–22:30', wait:9, wifi:false, sockets:true, seats:12, img:'https://images.unsplash.com/photo-1521017432531-fbd92d768814?q=80&w=800&auto=format&fit=crop'},
  {id:'c4', name:'Global Coffee — Шымкент Сити', address:'ТРЦ Shymkent City, 1 эт.', phone:'+7 701 444 55 66', hours:'10:00–23:00', wait:11, wifi:true, sockets:false, seats:30, img:'https://images.unsplash.com/photo-1495474472287-4d71bcdd2085?q=80&w=800&auto=format&fit=crop'},
];

const STATUS_LABEL = {
  NEW:'Новый', ACCEPTED:'Принят', PREPARING:'Готовится', READY:'Готов',
  CUSTOMER_COMING:'Клиент идёт', COMPLETED:'Получен', CANCELLED:'Отменён'
};

function defaultState(){
  return {
    role: 'guest',
    profile: { name:'Алексей', email:'alex@example.com', points:1240, favCafe:'c1', notif:{orders:true, promo:true, news:false} },
    cafes: seedCafes(),
    menu: seedMenu(),
    cart: [],
    cartCafe: 'c1',
    nextOrderId: 1846,
    orders: [
      {id:1842, cafeId:'c1', items:[{id:'m1',name:'Капучино',price:2000,qty:1,options:'350 мл · овсяное молоко'}], total:2000, status:'PREPARING', createdAt: Date.now()-2*60000, estMinutes:5, customerStatus:'idle', notifiedReady:false, pickupLabel:'Сейчас'},
      {id:1817, cafeId:'c1', items:[{id:'m2',name:'Латте',price:1800,qty:1,options:'350 мл'}], total:1800, status:'COMPLETED', createdAt: Date.now()-26*3600000, estMinutes:5, customerStatus:'idle', notifiedReady:true, pickupLabel:'Сейчас'},
      {id:1798, cafeId:'c2', items:[{id:'m13',name:'Круассан',price:750,qty:2,options:''}], total:1500, status:'COMPLETED', createdAt: Date.now()-3*24*3600000, estMinutes:3, customerStatus:'idle', notifiedReady:true, pickupLabel:'Сейчас'},
    ],
    shift: { barista:'Арман', ordersToday:83, revenueToday:214500, avgTime:'4:32', completed:79, cancelled:2,
      hourly:[['08:00',12],['10:00',18],['12:00',31],['14:00',22],['16:00',15]] }
  };
}

function loadState(){
  try{
    const raw = localStorage.getItem(STORAGE_KEY);
    if(!raw) { const s = defaultState(); saveState(s); return s; }
    return JSON.parse(raw);
  }catch(e){ const s = defaultState(); saveState(s); return s; }
}
function saveState(s){ localStorage.setItem(STORAGE_KEY, JSON.stringify(s)); }

let state = loadState();
let toastQueue = [];
let lastKnownStatuses = {}; // orderId -> status, to detect READY transitions for toast

/* ============================= ROUTER / RENDER ============================= */
function nav(hash){ location.hash = hash; }
function money(n){ return n.toLocaleString('ru-RU') + ' ₸'; }
function timeAgo(ts){
  const diff = Date.now()-ts;
  const mins = Math.floor(diff/60000);
  if(mins < 1) return 'только что';
  if(mins < 60) return mins+' мин назад';
  const hrs = Math.floor(mins/60);
  if(hrs < 24) return 'сегодня, '+ new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  if(hrs < 48) return 'вчера, '+ new Date(ts).toLocaleTimeString('ru-RU',{hour:'2-digit',minute:'2-digit'});
  return new Date(ts).toLocaleDateString('ru-RU');
}
function cafeById(id){ return state.cafes.find(c=>c.id===id); }
function menuById(id){ return state.menu.find(m=>m.id===id); }
function orderById(id){ return state.orders.find(o=>o.id===Number(id)); }
function cartTotal(){ return state.cart.reduce((s,i)=>s+i.price*i.qty,0); }
function cartCount(){ return state.cart.reduce((s,i)=>s+i.qty,0); }

function render(){
  const root = document.getElementById('root');
  const hash = location.hash.replace('#','') || (state.role==='barista' ? '/barista/queue' : '/home');
  const [path, param] = parseHash(hash);
  const content = renderPage(path, param);
  root.innerHTML = `
    <div class="app-shell">
      ${renderTopBar()}
      <div class="${state.role==='barista' ? '' : 'safe-bottom'}">
        ${content}
      </div>
      ${state.role==='guest' ? renderGuestNav(path) : renderBaristaNav(path)}
    </div>
    <div id="toast-layer" class="fixed top-4 right-4 left-4 sm:left-auto sm:w-96 z-50 flex flex-col gap-2 items-end pointer-events-none"></div>
  `;
  lucide.createIcons();
  flushToasts();
  checkReadyTransitions();
}

function parseHash(hash){
  const parts = hash.split('/').filter(Boolean);
  if(parts.length===0) return ['home', null];
  if(parts.length===1) return [parts[0], null];
  return [parts[0]+'/'+parts[1], parts[2] || null];
}

function renderPage(path, param){
  switch(path){
    case 'home': return pageHome();
    case 'cafes': return pageCafes();
    case 'cafe': return pageCafeDetail(param);
    case 'menu': return pageMenu();
    case 'product': return pageProduct(param);
    case 'cart': return pageCart();
    case 'checkout': return pageCheckout();
    case 'order': return pageOrderTracking(param);
    case 'history': return pageHistory();
    case 'loyalty': return pageLoyalty();
    case 'profile': return pageProfile();
    case 'barista/queue': return pageBaristaQueue();
    case 'barista/order': return pageBaristaOrderDetail(param);
    case 'barista/stats': return pageBaristaStats();
    default: return pageHome();
  }
}

/* ============================= TOP BAR / ROLE SWITCH ============================= */
function renderTopBar(){
  return `
  <div class="flex items-center justify-between px-5 pt-5 pb-2 sticky top-0 z-30 bg-[var(--cream)]/90 backdrop-blur">
    <div class="flex items-center gap-2">
      <div class="w-8 h-8 rounded-full flex items-center justify-center" style="background:var(--espresso)">
        <i data-lucide="coffee" class="w-4 h-4" style="color:var(--cream)"></i>
      </div>
      <span class="font-display font-semibold text-lg">Global Coffee</span>
    </div>
    <div class="role-toggle">
      <button data-action="setRole" data-role="guest" class="role-btn ${state.role==='guest'?'':''}" style="${state.role==='guest'?'background:var(--espresso);color:var(--cream)':'color:#B4A794'}">Гость</button>
      <button data-action="setRole" data-role="barista" class="role-btn" style="${state.role==='barista'?'background:var(--espresso);color:var(--cream)':'color:#B4A794'}">Бариста</button>
    </div>
  </div>`;
}

function renderGuestNav(path){
  const items = [
    {icon:'home', label:'Главная', path:'home', href:'#/home'},
    {icon:'map-pin', label:'Кофейни', path:'cafes', href:'#/cafes'},
    {icon:'shopping-bag', label:'Меню', path:'menu', href:'#/menu'},
    {icon:'shopping-cart', label:'Корзина', path:'cart', href:'#/cart', badge:cartCount()},
    {icon:'user', label:'Профиль', path:'profile', href:'#/profile'},
  ];
  return `
  <div class="fixed bottom-0 left-0 right-0 z-40">
    <div class="app-shell !min-h-0 !shadow-none px-2 pb-[calc(10px+env(safe-area-inset-bottom))] pt-2 border-t" style="background:#fff;border-color:#EFE3CF;">
      <div class="grid grid-cols-5">
        ${items.map(it=>`
          <a href="${it.href}" class="nav-item ${path===it.path?'active':''} relative py-1">
            <i data-lucide="${it.icon}" class="w-5 h-5"></i>
            <span>${it.label}</span>
            ${it.badge ? `<span class="absolute -top-0 right-6 text-[10px] font-bold text-white rounded-full w-4 h-4 flex items-center justify-center" style="background:var(--caramel)">${it.badge}</span>` : ''}
          </a>`).join('')}
      </div>
    </div>
  </div>`;
}

function renderBaristaNav(path){
  const items = [
    {icon:'clipboard-list', label:'Очередь', path:'barista/queue', href:'#/barista/queue'},
    {icon:'bar-chart-3', label:'Смена', path:'barista/stats', href:'#/barista/stats'},
    {icon:'user', label:'Профиль', path:'profile', href:'#/profile'},
  ];
  return `
  <div class="fixed bottom-0 left-0 right-0 z-40">
    <div class="app-shell !min-h-0 !shadow-none px-2 pb-[calc(10px+env(safe-area-inset-bottom))] pt-2 border-t" style="background:#fff;border-color:#EFE3CF;">
      <div class="grid grid-cols-3">
        ${items.map(it=>`
          <a href="${it.href}" class="nav-item ${path===it.path?'active':''} py-1">
            <i data-lucide="${it.icon}" class="w-5 h-5"></i>
            <span>${it.label}</span>
          </a>`).join('')}
      </div>
    </div>
  </div>`;
}

/* ============================= GUEST: HOME ============================= */

  return `

          <div class="text-sm text-gray-500 mt-0.5">🚶 6 минут пешком</div>

      </div>
    </div>

    <div class="text-xs font-bold uppercase tracking-wide mb-2" style="color:#B4A794">Быстрый заказ</div>
    <a href="#/menu" class="btn-primary flex items-center justify-center gap-2 py-4 mb-6 text-base">
      <i data-lucide="coffee" class="w-5 h-5"></i> Заказать кофе
    </a>

    <div class="text-xs font-bold uppercase tracking-wide mb-2" style="color:#B4A794">Ваши бонусы</div>
    <a href="#/loyalty" class="card p-5 flex items-center justify-between mb-6" style="background:var(--espresso);color:var(--cream)">
      <div>
        <div class="font-display text-2xl font-semibold">${state.profile.points.toLocaleString('ru-RU')} бонусов</div>
        <div class="text-sm opacity-70 mt-1">Подробнее →</div>

      ${popular.map(m=>`

    </div>
  </div>`;

/* ============================= GUEST: CAFES ============================= */
function pageCafes(){
  return `
  <div class="px-5 pb-8 fade-in">
    <h1 class="font-display text-2xl font-semibold mt-2 mb-5">Кофейни</h1>
    <div class="flex flex-col gap-3">
      ${state.cafes.map(c=>`
        <div class="card p-4">
          <div class="flex gap-3">
            <img src="${c.img}" class="w-20 h-20 rounded-2xl object-cover"/>
            <div class="flex-1">
              <div class="font-semibold">${c.name}</div>
              <div class="text-sm text-gray-500 mt-0.5">📍 ${c.address}</div>
              <div class="flex items-center gap-1 text-sm mt-1"><span class="dot-open"></span><span class="font-semibold" style="color:var(--sage)">Открыто</span><span class="text-gray-400">· ${c.hours}</span></div>
              <div class="text-xs text-gray-400 mt-0.5">Среднее ожидание: ${c.wait} мин</div>
            </div>
          </div>
          <a href="#/cafe/${
